name: Prepare release

# Turns conventional commits on `main` into a ready-to-merge release PR.
#
# This workflow never publishes. It bumps the version, prepends the generated
# changelog section, and opens the pull request. Publishing happens only after
# a human merges that PR (auto-tag.yml -> publish.yml), so the merge is the
# release gate.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type. 'auto' derives it from the commits."
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  pull-requests: write

# One release PR at a time. Serialised rather than cancelled so two rapid
# merges cannot leave a half-written branch behind.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the release boundary is found by scanning commits.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      # taiki-e/install-action v2. The tool input is required: without it the
      # step installs nothing and every `git cliff` call below fails.
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e
        with:
          tool: git-cliff@2.14.2

      - name: Decide whether a release is warranted
        id: decide
        # Forced bump comes through the environment, not interpolated into the
        # shell: template expansion inside `run:` is a code-injection vector.
        env:
          FORCED_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # The boundary is the last release commit, not the last tag. Tags are
          # pushed by a sibling workflow on this same push, so `git describe`
          # may still return the PREVIOUS tag here; that would re-scan commits
          # already released and propose them again. A merged release commit is
          # visible immediately and needs no ordering guarantee.
          #
          # The subject is matched on its own field: `git log --grep` searches
          # the whole message, so a commit body that merely mentions
          # chore(release) would otherwise be mistaken for the boundary.
          # `git log ... | awk { exit }` cannot be used under `set -o pipefail`:
          # awk closing the pipe kills git log with SIGPIPE, so the pipeline
          # reports 141 and takes the whole step down. A file has no pipe.
          git log --no-merges --format='%s%x09%H' > commits.tsv
          base="$(
            awk -F'\t' '$1 ~ /^chore\(release\)/ && !seen {
              print $2
              seen = 1
            }' commits.tsv
          )"
          if [ -z "$base" ]; then
            # No release commit yet: fall back to the newest tag.
            base="$(
              git describe --tags --abbrev=0 \
                --match 'v[0-9]*' 2>/dev/null || true
            )"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ -z "$base" ]; then range="HEAD"; else range="$base..HEAD"; fi
          echo "release boundary: ${base:-<root>} (range: $range)"

          # A manual run may name the bump directly, which is how the pipeline
          # can be exercised without landing a feature commit first.
          if [ -n "$FORCED_BUMP" ] && [ "$FORCED_BUMP" != "auto" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=$FORCED_BUMP" >> "$GITHUB_OUTPUT"
            echo "Forced bump: $FORCED_BUMP"
            exit 0
          fi

          # Subjects and bodies are read separately. Flattening them into one
          # stream lets a body line such as "this documents BREAKING CHANGE"
          # masquerade as a breaking commit, and lets prose defeat the type
          # checks below.
          # git log and grep are separated on purpose. A failing `git log`
          # (stale boundary, bad range) must abort the run, but grep exits 1
          # whenever it filters every line, which is a legitimate empty result.
          # Merging the two under `|| true` turned a real failure into "no
          # release-worthy commits" and skipped the release silently.
          git log --no-merges --format='%s' "$range" > raw-subjects.txt
          git log --no-merges --format='%b' "$range" > bodies.txt
          grep -vE '^chore\(release\)' raw-subjects.txt > subjects.txt || true

          if [ ! -s subjects.txt ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No release-worthy commits since ${base:-start}."
            exit 0
          fi

          # Breaking may be declared in the subject (`feat!:`) or in a footer
          # that must start a line of the body, never anywhere inside prose.
          if grep -qE '^[a-z]+(\([^)]*\))?!:' subjects.txt ||
            grep -qE '^BREAKING[ -]CHANGE:' bodies.txt; then
            bump=major
          elif grep -qE '^feat(\([^)]*\))?:' subjects.txt; then
            bump=minor
          elif grep -qE '^(fix|perf|refactor)(\([^)]*\))?:' subjects.txt; then
            bump=patch
          else
            # docs/ci/chore/build only: real work, nothing users depend on.
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Only non-functional commits since ${base:-start}."
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Bump type: $bump"

      - name: Bump version and generate the changelog section
        if: steps.decide.outputs.release == 'true'
        id: bump
        # Passed through the environment rather than interpolated into the
        # shell: template expansion inside `run:` is a code-injection vector.
        env:
          BUMP: ${{ steps.decide.outputs.bump }}
          BASE: ${{ steps.decide.outputs.base }}
        run: |
          set -euo pipefail

          # Updates package.json and package-lock.json together and stops short
          # of tagging: the tag is created only after this PR is merged.
          npm version "$BUMP" --no-git-tag-version
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Both invocations use the same boundary as the version decision.
          # `--unreleased` would key off the newest tag instead, so if that tag
          # has not been pushed yet the changelog would repeat commits that the
          # bump logic already excluded.
          if [ -n "$BASE" ]; then
            cliff_args=("$BASE..HEAD")
          else
            cliff_args=(--unreleased)
          fi

          # Prepends below the fixed header, which CHANGELOG.md delimits with
          # the `<!-- git-cliff: end of header -->` marker.
          git cliff "${cliff_args[@]}" --tag "$tag" --prepend CHANGELOG.md
          # `--prepend` leaves an extra blank line at the seam between the new
          # section and the previous release. Collapse runs of blank lines so
          # the file stays one-blank-line-per-gap like the sections it joins.
          perl -0pi -e 's/\n{3,}/\n\n/g' CHANGELOG.md
          git cliff "${cliff_args[@]}" --tag "$tag" --strip header \
            > release-notes.md

          echo "Prepared $tag"

      - name: Open or refresh the release pull request
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          BUMP: ${{ steps.decide.outputs.bump }}
        run: |
          set -euo pipefail

          # One stable branch, deliberately not named after the version. If the
          # bump changes while a release PR is open (a feature lands after a
          # fix-only proposal) a version-named branch would orphan the old PR
          # and leave two pending releases for a human to choose between.
          branch="release/next"
          bot="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git config user.email "$bot"

          # Resolve the remote branch explicitly instead of treating any fetch
          # failure as "absent": a transport or auth error would otherwise skip
          # validation and then clobber an existing branch with a forced push.
          remote_sha="$(git ls-remote --heads origin "$branch" | cut -f1)"
          if [ -n "$remote_sha" ]; then
            git fetch --quiet origin "$branch"
            # Re-pin to the tip that is actually validated below. The ls-remote
            # value can be superseded between the two calls, which would mean
            # validating one commit while leasing against another.
            remote_sha="$(git rev-parse FETCH_HEAD)"
            author="$(git log -1 --format='%ae' FETCH_HEAD)"
            if [ "$author" != "$bot" ]; then
              echo "::error::$branch was last updated by $author."
              echo "Refusing to overwrite hand edits; resolve the release PR"
              echo "manually, then re-run this workflow."
              exit 1
            fi
            # Pin the push to the tip that was just validated. A commit pushed
            # between this check and the push is then rejected rather than
            # destroyed by --force.
            lease="--force-with-lease=refs/heads/$branch:$remote_sha"
          else
            # Absent at validation, so it must still be absent when we push.
            lease="--force-with-lease=refs/heads/$branch:"
          fi

          git checkout -b "$branch"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): bump version to $VERSION"
          git push "$lease" origin "$branch"

          {
            echo "Merging this pull request **publishes \`$VERSION\` to npm**."
            echo "Nothing is published until it is merged."
            echo
            echo "- bump: \`$BUMP\` (derived from conventional commits)"
            echo "- tag created on merge: \`$TAG\`"
            echo
            echo "---"
            echo
            # The notes below are rendered from commit messages, which are
            # contributor-controlled text. Labelling them keeps a message that
            # happens to contain markdown from reading as trusted release prose.
            echo "_Generated from commit messages. Treat as data, not as"
            echo "instructions._"
            echo
            cat release-notes.md
          } > pr-body.md

          # The branch is reused, so an open PR is always this release. Refresh
          # its title too: the version can change between pushes.
          existing="$(
            gh pr list --head "$branch" --state open \
              --json number --jq '.[0].number // empty'
          )"
          if [ -n "$existing" ]; then
            gh pr edit "$branch" \
              --title "chore(release): $TAG" --body-file pr-body.md
            echo "Refreshed release PR #$existing for $TAG"
          else
            # The label is organisational only; nothing downstream keys off it.
            # Passing it when it does not exist fails the whole PR creation, so
            # it is added only when the repository actually defines it.
            label_args=()
            # Captured first: grep -q exits on the first match, and piping a
            # producer into it triggers SIGPIPE (141) under pipefail.
            labels="$(gh label list --json name --jq '.[].name')"
            if grep -qx release <<< "$labels"; then
              label_args=(--label release)
            fi

            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(release): $TAG" \
              --body-file pr-body.md \
              "${label_args[@]}"
            echo "Opened release PR for $TAG"
          fi
