name: Prepare release

# Turns conventional commits on `main` into a ready-to-merge release PR.
#
# This workflow never publishes. It bumps the version, prepends the generated
# changelog section, and opens the pull request. Publishing happens only after
# a human merges that PR (auto-tag.yml -> publish.yml), so the merge is the
# release gate.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type. 'auto' derives it from the commits."
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  pull-requests: write

# One release PR at a time. Serialised rather than cancelled so two rapid
# merges cannot leave a half-written branch behind.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags and full history are required to diff against the last release.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      # taiki-e/install-action v2
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e
        with:
          tool: git-cliff

      - name: Decide whether a release is warranted
        id: decide
        # Forced bump comes through the environment, not interpolated into the
        # shell: template expansion inside `run:` is a code-injection vector.
        env:
          FORCED_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # A manual run may name the bump directly, which is how the pipeline
          # can be exercised without landing a feature commit first.
          if [ -n "$FORCED_BUMP" ] && [ "$FORCED_BUMP" != "auto" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=$FORCED_BUMP" >> "$GITHUB_OUTPUT"
            echo "Forced bump: $FORCED_BUMP"
            exit 0
          fi

          # Every tag in this repo is lightweight, so --tags is required: bare
          # `git describe` refuses lightweight tags and would silently fall
          # back to the whole history below.
          last="$(
            git describe --tags --abbrev=0 \
              --match 'v[0-9]*' 2>/dev/null || true
          )"
          if [ -z "$last" ]; then range="HEAD"; else range="$last..HEAD"; fi
          echo "last release: ${last:-<none>} (range: $range)"

          # The version bump and the merges carrying it describe the release
          # itself, so they must never justify the *next* one. Without this
          # filter every release would trigger another release.
          git log --no-merges --format='%s%n%b' "$range" \
            | grep -vE '^(chore\(release\)|Merge )' > subjects.txt || true

          if [ ! -s subjects.txt ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No release-worthy commits since ${last:-start}."
            exit 0
          fi

          if grep -qE '^[a-z]+(\(.+\))?!:' subjects.txt ||
            grep -qE 'BREAKING[ -]CHANGE' subjects.txt; then
            bump=major
          elif grep -qE '^feat(\(.+\))?:' subjects.txt; then
            bump=minor
          elif grep -qE '^(fix|perf|refactor)(\(.+\))?:' subjects.txt; then
            bump=patch
          else
            # docs/ci/chore/build only: real work, nothing users depend on.
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Only non-functional commits since ${last:-start}."
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Bump type: $bump"

      - name: Bump version and generate the changelog section
        if: steps.decide.outputs.release == 'true'
        id: bump
        # Passed through the environment rather than interpolated into the
        # shell: template expansion inside `run:` is a code-injection vector.
        env:
          BUMP: ${{ steps.decide.outputs.bump }}
        run: |
          set -euo pipefail

          # Updates package.json and package-lock.json together and stops short
          # of tagging: the tag is created only after this PR is merged.
          npm version "$BUMP" --no-git-tag-version
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Prepends below the fixed header, which CHANGELOG.md delimits with
          # the `<!-- git-cliff: end of header -->` marker.
          git cliff --unreleased --tag "$tag" --prepend CHANGELOG.md
          # `--prepend` leaves an extra blank line at the seam between the new
          # section and the previous release. Collapse runs of blank lines so
          # the file stays one-blank-line-per-gap like the sections it joins.
          perl -0pi -e 's/\n{3,}/\n\n/g' CHANGELOG.md
          git cliff --unreleased --tag "$tag" --strip header > release-notes.md

          echo "Prepared $tag"

      - name: Open or refresh the release pull request
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          BUMP: ${{ steps.decide.outputs.bump }}
        run: |
          set -euo pipefail

          branch="release/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): bump version to $VERSION"
          git push --force origin "$branch"

          {
            echo "Merging this pull request **publishes \`$VERSION\` to npm**."
            echo "Nothing is published until it is merged."
            echo
            echo "- bump: \`$BUMP\` (derived from conventional commits)"
            echo "- tag created on merge: \`$TAG\`"
            echo
            echo "---"
            echo
            cat release-notes.md
          } > pr-body.md

          # A second merge while this PR is open recomputes the same version,
          # so refresh that branch instead of failing on a duplicate PR.
          existing="$(
            gh pr list --head "$branch" --state open \
              --json number --jq '.[0].number // empty'
          )"
          if [ -n "$existing" ]; then
            gh pr edit "$branch" \
              --title "chore(release): $TAG" --body-file pr-body.md
            echo "Refreshed release PR #$existing for $TAG"
          else
            # The label is organisational only; nothing downstream keys off it.
            # Passing it when it does not exist fails the whole PR creation, so
            # it is added only when the repository actually defines it.
            label_args=()
            if gh label list --json name --jq '.[].name' \
              | grep -qx release; then
              label_args=(--label release)
            fi

            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(release): $TAG" \
              --body-file pr-body.md \
              "${label_args[@]}"
            echo "Opened release PR for $TAG"
          fi
