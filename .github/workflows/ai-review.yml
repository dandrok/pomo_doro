name: AI review

# Diff-grounded review from @dandrok/ai-review. Comment-only for now: the
# verdict is computed from findings but `fail_on: never` in .ai-review.yml
# keeps this job green while we measure which findings actually get fixed.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # Posting the review back to the pull request needs write access.
  pull-requests: write

# A new push supersedes the previous review of the same pull request.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork pull requests never receive repository secrets, and the key may not
    # be configured yet. Its presence is surfaced as an env var because the
    # `secrets` context is not available to `if:` expressions.
    env:
      AI_REVIEW_ENABLED: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    steps:
      - name: Explain why the review is skipped
        if: env.AI_REVIEW_ENABLED != 'true'
        run: |
          echo "::notice::DEEPSEEK_API_KEY is unset or this is a fork pull \
          request, so no review was run."

      - uses: actions/checkout@v6
        if: env.AI_REVIEW_ENABLED == 'true'
        with:
          # The base branch must exist locally: the review diffs against it.
          fetch-depth: 0
          # The tool posts over the API with GITHUB_TOKEN; it never pushes.
          persist-credentials: false

      - uses: actions/setup-node@v6
        if: env.AI_REVIEW_ENABLED == 'true'
        with:
          node-version: 24

      - name: Review the pull request
        if: env.AI_REVIEW_ENABLED == 'true'
        env:
          # A ref is never interpolated into the script: git permits ; | $( )
          # and backticks in branch names, and `${{ }}` is substituted before
          # bash parses it.
          BASE_REF: ${{ github.base_ref }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npx -y @dandrok/ai-review@0.2.2 review \
            --base "origin/$BASE_REF" --post
